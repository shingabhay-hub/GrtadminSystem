version: '3.8'

services:
  # Frontend - Static HTML/CSS/JS served by Nginx
  frontend:
    image: nginx:alpine
    container_name: grt-admin-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./README.md:/usr/share/nginx/html/README.md:ro
      - ./DEPLOYMENT.md:/usr/share/nginx/html/DEPLOYMENT.md:ro
      - ./QUICKSTART.md:/usr/share/nginx/html/QUICKSTART.md:ro
      - ./TESTING.md:/usr/share/nginx/html/TESTING.md:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      - TZ=UTC
    networks:
      - grt-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    labels:
      - "com.grt.service=frontend"
      - "com.grt.description=GRT Admin Console Frontend"

  # Backend - Express.js API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: grt-admin-api:latest
    container_name: grt-admin-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - LOG_LEVEL=info
      - CORS_ORIGIN=http://localhost,http://frontend,https://shingabhay-hub.github.io
      - JWT_SECRET=${JWT_SECRET:-grt-admin-default-secret-change-in-production}
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - grt-network
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "com.grt.service=backend"
      - "com.grt.description=GRT Admin Console REST API"

  # Database - MongoDB for persistent storage
  mongodb:
    image: mongo:6.0-alpine
    container_name: grt-admin-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-changeme}
      - MONGO_INITDB_DATABASE=grt_admin
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./init-mongodb.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - grt-network
    healthcheck:
      test: echo 'db.adminCommand("ping")' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "com.grt.service=database"
      - "com.grt.description=MongoDB Database"

  # Redis - For caching and sessions
  redis:
    image: redis:7-alpine
    container_name: grt-admin-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    networks:
      - grt-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    labels:
      - "com.grt.service=cache"
      - "com.grt.description=Redis Cache"

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: grt-admin-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - grt-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    labels:
      - "com.grt.service=monitoring"
      - "com.grt.description=Prometheus Metrics"

  # Visualization - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grt-admin-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana-dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
    networks:
      - grt-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "com.grt.service=visualization"
      - "com.grt.description=Grafana Dashboard"

  # Log Aggregation - ELK Stack (Elasticsearch)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.0.0
    container_name: grt-admin-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - grt-network
    healthcheck:
      test: curl -s http://localhost:9200 >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    labels:
      - "com.grt.service=logging"
      - "com.grt.description=Elasticsearch Log Storage"

  # Reverse Proxy - Traefik (Optional, for production)
  traefik:
    image: traefik:latest
    container_name: grt-admin-traefik
    ports:
      - "8080:8080"  # Dashboard
      - "8443:8443"  # HTTPS
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik.yml:/traefik.yml:ro
      - ./traefik-dynamic.yml:/traefik-dynamic.yml:ro
    networks:
      - grt-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "com.grt.service=proxy"
      - "com.grt.description=Traefik Reverse Proxy"

networks:
  grt-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local
