apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "[logstash-]YYYY.MM.DD"
    jsonData:
      esVersion: "8.0.0"
      logMessageField: message
      logLevelField: level

  - name: MongoDB
    type: mongodb
    access: proxy
    url: mongodb:27017
    database: grt_admin
    jsonData:
      authUser: admin
